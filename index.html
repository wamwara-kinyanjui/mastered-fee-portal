<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastered Comprehensive School - Fee Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,"Segoe UI",sans-serif}
body{margin:0;background:#F5F7FB;display:flex;justify-content:center;padding:15px}
.card{background:#fff;max-width:440px;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.header{background:#0B1C33;color:#fff;padding:22px;text-align:center}
.header h2{margin:0 0 6px}
.header p{margin:0;opacity:.85}
.body{padding:20px}
.input{width:100%;padding:14px;border:2px solid #E5E9F2;border-radius:10px;font-size:16px;text-transform:uppercase}
.input:focus{outline:none;border-color:#0B1C33}
.btn{width:100%;margin-top:14px;background:#0B1C33;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;display:none}
.msg.show{display:block}
.msg.error{background:#FDECEC;color:#9B1C1C}
.result{margin-top:18px;border:2px dashed #E5E9F2;border-radius:12px;padding:16px;display:none;line-height:1.7}
.result.show{display:block}
#qrTemp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h2>Mastered Comprehensive School</h2>
    <p>Official Fee Portal • 0721 101 702</p>
  </div>
  <div class="body">
    <input id="key" class="input" placeholder="Enter student code, e.g. MCS-JK-4821" autocomplete="off">
    <button id="btn" class="btn">View Statement</button>
    <div id="msg" class="msg error" role="alert"></div>
    <div id="resultWrap" class="result">
      <div id="resultCard"></div>
      <button id="pdfBtn" class="btn">Download PDF Receipt with QR</button>
    </div>
  </div>
</div>
<div id="qrTemp"></div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyVLRadONiwq3bQdTl2o_MSiHspkrnugXNicJFmOiLLxyR2R15-Z4gdp7wW5g4sDqdczA/exec";

let lastData = null;

const keyInput   = document.getElementById("key");
const btn        = document.getElementById("btn");
const msg        = document.getElementById("msg");
const resultWrap = document.getElementById("resultWrap");
const resultCard = document.getElementById("resultCard");

// JSONP request: avoids the CORS block that fetch() hits with Apps Script
function fetchJSONP(url) {
  return new Promise((resolve, reject) => {
    const cbName = "cb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    const script = document.createElement("script");

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("The request timed out. Check your connection and try again."));
    }, 20000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      script.remove();
    }

    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => {
      cleanup();
      reject(new Error("Could not reach the server. Check the web app URL and deployment access."));
    };

    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName;
    document.body.appendChild(script);
  });
}

function showError(text) {
  msg.textContent = text;
  msg.classList.add("show");
  resultWrap.classList.remove("show");
}

function clearError() {
  msg.textContent = "";
  msg.classList.remove("show");
}

function renderResult(d) {
  resultCard.textContent = "";

  const name = document.createElement("b");
  name.textContent = d.student_name;
  resultCard.appendChild(name);

  const rows = [
    ["Class", d.class],
    ["Parent", d.parent_name],
    ["Balance", "KES " + d.balance],
    ["Status", d.status]
  ];

  rows.forEach(([label, value]) => {
    resultCard.appendChild(document.createElement("br"));
    resultCard.appendChild(document.createTextNode(label + ": " + value));
  });

  resultWrap.classList.add("show");
}

async function lookup() {
  const key = keyInput.value.trim().toUpperCase();
  clearError();

  if (!key) {
    showError("Enter the student code.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Checking...";

  try {
    const d = await fetchJSONP(WEB_APP_URL + "?key=" + encodeURIComponent(key));

    if (d.error === "SHEET_NOT_FOUND") {
      showError("Server setup problem: the sheet tab was not found. Please contact the school.");
      return;
    }
    if (d.error) {
      showError("Student code not found. Check the code and try again.");
      return;
    }

    lastData = { ...d, key };
    renderResult(d);
  } catch (e) {
    console.error("Fee portal error:", e);
    showError("Unable to retrieve balance: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "View Statement";
  }
}

btn.addEventListener("click", lookup);
keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(); });

document.getElementById("pdfBtn").addEventListener("click", () => {
  if (!lastData) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const receiptId = "MCS-" + Date.now().toString().slice(-8);
  const dateStr = new Date().toLocaleString();

  const qrDiv = document.getElementById("qrTemp");
  qrDiv.innerHTML = "";
  new QRCode(qrDiv, {
    text: `${lastData.student_name}|${lastData.key}|KES ${lastData.balance}|${receiptId}`,
    width: 100,
    height: 100
  });

  setTimeout(() => {
    const qr = qrDiv.querySelector("canvas");
    const qrData = qr ? qr.toDataURL() : null;

    doc.setFillColor(11, 28, 51);
    doc.rect(0, 0, 210, 35, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(18);
    doc.text("Mastered Comprehensive School", 105, 20, { align: "center" });

    doc.setTextColor(0, 0, 0);
    doc.setFontSize(12);
    let y = 50;
    doc.text(`Receipt: ${receiptId}`, 14, y); y += 10;
    doc.text(`Date: ${dateStr}`, 14, y); y += 10;
    doc.text(`Student: ${lastData.student_name}`, 14, y); y += 10;
    doc.text(`Class: ${lastData.class}`, 14, y); y += 10;
    doc.text(`Balance: KES ${lastData.balance}`, 14, y); y += 10;
    doc.text(`Status: ${lastData.status}`, 14, y); y += 15;

    if (qrData) doc.addImage(qrData, "PNG", 14, y, 35, 35);

    doc.save(`${lastData.key}_Receipt.pdf`);
  }, 300);
});
</script>
</body>
</html>
